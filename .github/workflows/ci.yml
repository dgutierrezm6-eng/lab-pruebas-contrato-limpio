name: Pipeline de Calidad - Contrato Limpio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pruebas-automatizadas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright pytest-playwright
          playwright install --with-deps chromium

      - name: Auditoría de seguridad estática (Bandit)
        run: bandit -r app/

      - name: Pruebas Unitarias, Integración y Seguridad con Cobertura
        run: pytest tests/unit tests/integration tests/security --cov=app --cov-report=term-missing

      - name: Pruebas de Aceptación BDD (Behave)
        run: behave

      - name: Pruebas E2E en navegador (Playwright)
        run: |
          python -m app.api &
          sleep 2
          pytest tests/e2e
